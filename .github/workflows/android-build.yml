name: Build Completo do Zero (Ecrã Inteiro Absoluto - Correção Vite)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Baixar os arquivos do repositório
      uses: actions/checkout@v4

    - name: 2. Configurar o Node.js (Versão 22)
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: 3. Configurar o Java (JDK 21)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: 4. Configurar o Android SDK
      uses: android-actions/setup-android@v3

    - name: 5. Instalar Dependências (Incluindo Plugins para Satisfazer o Rollup)
      run: |
        npm install --legacy-peer-deps
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/local-notifications@latest --legacy-peer-deps
        npm install sharp --legacy-peer-deps

    - name: 6. Compilar o projeto React TS (Gera a pasta dist)
      run: npm run build

    - name: 7. Criar a pasta Android Limpa sem Notificações Ativas
      run: |
        rm -rf android
        rm -f capacitor.config.json
        rm -f capacitor.config.ts
        rm -f capacitor.config.js
        
        # Configuração nativa sem declarar o plugin LocalNotifications no JSON
        echo '{
          "appId": "com.fighterlegendone.app",
          "appName": "Fighter Legend One",
          "webDir": "dist",
          "android": {
            "orientation": "landscape",
            "allowMixedContent": true
          },
          "plugins": {
            "SplashScreen": {
              "launchShowDuration": 0,
              "launchFadeOutDuration": 0,
              "backgroundColor": "#000000"
            }
          }
        }' > capacitor.config.json
        
        npx cap add android

    - name: 8. Sincronizar o código compilado com o Android
      run: |
        npx cap update android
        npx cap sync android

    - name: 8.5. Gerar Ícones Limpos (Evitar Recursos Duplicados)
      run: |
        if [ -f "icon.png" ]; then
          node -e "
            const fs = require('fs');
            const path = require('path');
            const sharp = require('sharp');
            
            const resDir = 'android/app/src/main/res';
            if (fs.existsSync(resDir)) {
              const foldersToClean = ['mipmap-anydpi-v26', 'mipmap-hdpi', 'mipmap-mdpi', 'mipmap-xhdpi', 'mipmap-xxhdpi', 'mipmap-xxxhdpi'];
              foldersToClean.forEach(folder => {
                const p = path.join(resDir, folder);
                if (fs.existsSync(p)) {
                  fs.readdirSync(p).forEach(file => {
                    if (file.includes('ic_launcher')) {
                      fs.unlinkSync(path.join(p, file));
                    }
                  });
                }
              });

              const resolutions = {
                'mipmap-mdpi': 48,
                'mipmap-hdpi': 72,
                'mipmap-xhdpi': 96,
                'mipmap-xxhdpi': 144,
                'mipmap-xxxhdpi': 192
              };

              Object.keys(resolutions).forEach(folder => {
                const folderPath = path.join(resDir, folder);
                if (!fs.existsSync(folderPath)) fs.mkdirSync(folderPath, { recursive: true });
                
                const size = resolutions[folder];
                const iconDest = path.join(folderPath, 'ic_launcher.png');
                const iconRoundDest = path.join(folderPath, 'ic_launcher_round.png');

                sharp('icon.png').resize(size, size).toFile(iconDest);
                sharp('icon.png').resize(size, size).toFile(iconRoundDest);
              });
              console.log('Ícones recriados com Sharp!');
            }
          "
        else
          echo "Aviso: icon.png não encontrado."
        fi

    - name: 9. Forçar Ecrã Inteiro Absoluto no Manifesto e Estilos
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="landscape"/' $MANIFEST
          sed -i '/
