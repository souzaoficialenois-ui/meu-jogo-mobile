name: Build Completo do Zero (Ecrã Inteiro Absoluto - Remoção Forçada)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Baixar os arquivos do repositório
      uses: actions/checkout@v4

    - name: 2. Configurar o Node.js (Versão 22)
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: 3. Configurar o Java (JDK 21)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: 4. Configurar o Android SDK
      uses: android-actions/setup-android@v3

    - name: 5. Instalar Dependências Puras e Expulsar Plugins de Notificação
      run: |
        # Instala as dependências padrão do projeto
        npm install --legacy-peer-deps
        
        # Força a desinstalação completa dos plugins de notificação para garantir que o Capacitor não os injete no Android
        npm uninstall @capacitor/local-notifications @capacitor/push-notifications --legacy-peer-deps
        
        # Alinha o núcleo do Capacitor e o Sharp para os ícones
        npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --legacy-peer-deps
        npm install sharp --legacy-peer-deps

    - name: 6. Compilar o projeto React TS (Gera a pasta dist)
      run: npm run build

    - name: 7. Criar a pasta Android Limpa
      run: |
        rm -rf android
        rm -f capacitor.config.json
        rm -f capacitor.config.ts
        rm -f capacitor.config.js
        
        echo '{
          "appId": "com.fighterlegendone.app",
          "appName": "Fighter Legend One",
          "webDir": "dist",
          "android": {
            "orientation": "landscape",
            "allowMixedContent": true
          },
          "plugins": {
            "SplashScreen": {
              "launchShowDuration": 0,
              "launchFadeOutDuration": 0,
              "backgroundColor": "#000000"
            }
          }
        }' > capacitor.config.json
        
        npx cap add android

    - name: 8. Sincronizar o código compilado com o Android
      run: |
        # O update e sync agora vão rodar sem nenhum plugin de notificação na árvore de nós
        npx cap update android
        npx cap sync android

    - name: 8.5. Gerar Ícones em Alta Resolução
      run: |
        if [ -f "icon.png" ]; then
          node -e "
            const fs = require('fs');
            const path = require('path');
            const sharp = require('sharp');
            
            const resDir = 'android/app/src/main/res';
            if (fs.existsSync(resDir)) {
              const anyDpiDir = path.join(resDir, 'mipmap-anydpi-v26');
              if (fs.existsSync(anyDpiDir)) {
                fs.readdirSync(anyDpiDir).forEach(file => fs.unlinkSync(path.join(anyDpiDir, file)));
              }

              const resolutions = {
                'mipmap-mdpi': 48,
                'mipmap-hdpi': 72,
                'mipmap-xhdpi': 96,
                'mipmap-xxhdpi': 144,
                'mipmap-xxxhdpi': 192
              };

              Object.keys(resolutions).forEach(folder => {
                const folderPath = path.join(resDir, folder);
                if (!fs.existsSync(folderPath)) fs.mkdirSync(folderPath, { recursive: true });
                
                fs.readdirSync(folderPath).forEach(file => {
                  if (file.endsWith('.xml')) fs.unlinkSync(path.join(folderPath, file));
                });

                const size = resolutions[folder];
                const iconDest = path.join(folderPath, 'ic_launcher.png');
                const iconRoundDest = path.join(folderPath, 'ic_launcher_round.png');

                sharp('icon.png').resize(size, size).toFile(iconDest);
                sharp('icon.png').resize(size, size).toFile(iconRoundDest);
              });
              console.log('Ícones gerados com sucesso!');
            }
          "
        else
          echo "Aviso: icon.png não encontrado."
        fi

    - name: 9. Forçar Ecrã Inteiro e Ocultar Barra Superior
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="landscape"/' $MANIFEST
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $MANIFEST
        fi

        STYLES_FILE=$(find android/ -name "styles.xml" | head -n 1)
        if [ -f "$STYLES_FILE" ]; then
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('$STYLES_FILE', 'utf8');
            const fullscreenConfig = '        <item name=\"android:windowFullscreen\">true</item>\n        <item name=\"android:windowContentOverlay\">@null</item>';
            if (content.includes('</style>')) {
              content = content.replace('</style>', fullscreenConfig + '\n    </style>');
              fs.writeFileSync('$STYLES_FILE', content, 'utf8');
              console.log('Estilos configurados para Ecrã Inteiro!');
            }
          "
        fi

        MAIN_ACTIVITY=$(find android/ -name "MainActivity.java" | head -n 1)
        if [ -f "$MAIN_ACTIVITY" ]; then
          PACKAGE_LINE=$(grep "package" $MAIN_ACTIVITY)
          echo "$PACKAGE_LINE" > $MAIN_ACTIVITY
          echo "" >> $MAIN_ACTIVITY
          echo "import com.getcapacitor.BridgeActivity;" >> $MAIN_ACTIVITY
          echo "" >> $MAIN_ACTIVITY
          echo "public class MainActivity extends BridgeActivity {}" >> $MAIN_ACTIVITY
        fi

    - name: 10. Compilar o APK Final Completamente Limpo
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean assembleRelease

    - name: 11. Liberar o APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: Fighter-Legend-One-APK
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
